services:
  # 🗄️ MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: movie-theater-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 12345Aa
      MYSQL_DATABASE: cinema_db
      MYSQL_USER: cinema_user
      MYSQL_PASSWORD: cinema_password
    ports:
      - "3306:3306"
    volumes:
      # Persistent data storage
      - mysql-data:/var/lib/mysql
      # Initialize database với sample data
      - ./configs/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # MySQL configuration
      - ./configs/mysql.cnf:/etc/mysql/conf.d/mysql.cnf:ro
    networks:
      - movie-theater-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345Aa" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 🎬 Spring Boot Backend Service
  backend:
    build:
      context: ../movie-theater-backend
      dockerfile: Dockerfile
    container_name: movie-theater-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Database connection
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cinema_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 12345Aa

      # JPA/Hibernate settings
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"

      # JWT settings
      JWT_SECRET: ${JWT_SECRET:-bW92aWVUaGVhdGVyU2VjcmV0S2V5MjAyNUZvckpXVFRva2VuR2VuZXJhdGlvbg==}

      # Email configuration
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-lumierecinema25@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-jstdgruqurruswtc}
      EMAIL_FROM: ${EMAIL_FROM:-lumierecinema25@gmail.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Lumiere Cinema}
      EMAIL_VERIFICATION_BASE_URL: ${EMAIL_VERIFICATION_BASE_URL:-http://localhost:8080}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}

      # Application settings
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker

    ports:
      - "8080:8080"
    volumes:
      # File uploads storage
      - backend-uploads:/app/uploads
      # Logs
      - backend-logs:/app/logs
    networks:
      - movie-theater-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/cinema/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # 🎭 NextJS Frontend Service  
  frontend:
    build:
      context: ../movie-theater-frontend
      dockerfile: Dockerfile
    container_name: movie-theater-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # API connection
      NEXT_PUBLIC_API_URL: http://backend:8080
      NEXT_PUBLIC_APP_URL: http://localhost:3000

      # Node environment
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"

    ports:
      - "3000:3000"
    volumes:
      # Logs nếu cần
      - frontend-logs:/app/.next/cache
    networks:
      - movie-theater-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 📊 Adminer - Database Management Tool (Optional)
  adminer:
    image: adminer:4.8.1
    container_name: movie-theater-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:8080"
    networks:
      - movie-theater-network
    environment:
      ADMINER_DEFAULT_SERVER: mysql

# 🌐 Networks
networks:
  movie-theater-network:
    driver: bridge
    name: movie-theater-network

# 💾 Volumes
volumes:
  mysql-data:
    name: movie-theater-mysql-data
  backend-uploads:
    name: movie-theater-backend-uploads
  backend-logs:
    name: movie-theater-backend-logs
  frontend-logs:
    name: movie-theater-frontend-logs
