version: '3.8'

# Development overrides
services:
  # Development Backend với hot reload
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      LOGGING_LEVEL_COM_MOVIETHEATER: DEBUG
    volumes:
      # Mount source code để hot reload
      - ../movie-theater-backend/src:/app/src:ro
    command: [ "mvn", "spring-boot:run", "-Dspring-boot.run.jvmArguments=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005" ]
    ports:
      - "8080:8080"
      - "5005:5005" # Debug port

  # Development Frontend với hot reload
  frontend:
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8080
    volumes:
      # Mount source code để hot reload
      - ../movie-theater-frontend/src:/app/src:cached
      - ../movie-theater-frontend/public:/app/public:cached
      - /app/node_modules
      - /app/.next
    command: [ "npm", "run", "dev" ]
    ports:
      - "3000:3000"
      - "3001:3001" # NextJS inspector

  # Development Database với port mapping
  mysql:
    ports:
      - "3306:3306" # Expose để có thể connect từ local tools
    environment:
      MYSQL_ROOT_PASSWORD: dev_password
    command: --innodb-use-native-aio=0 # Fix for Windows/Docker Desktop 
