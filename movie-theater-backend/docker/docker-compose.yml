version: '3.8'

services:
  # 🗄️ MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: movie-theater-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 12345Aa
      MYSQL_DATABASE: cinema_db
      MYSQL_USER: cinema_user
      MYSQL_PASSWORD: cinema_password
    ports:
      - "3306:3306"
    volumes:
      # Persistent data storage
      - mysql-data:/var/lib/mysql
      # Initialize database với sample data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # MySQL configuration
      - ./mysql.cnf:/etc/mysql/conf.d/mysql.cnf:ro
    networks:
      - movie-theater-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345Aa"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 🎬 Spring Boot Application Service
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: movie-theater-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Database connection
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cinema_db
      SPRING_DATASOURCE_USERNAME: cinema_user
      SPRING_DATASOURCE_PASSWORD: cinema_password
      
      # JPA/Hibernate settings
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      
      # JWT settings
      JWT_SECRET: ${JWT_SECRET:-bW92aWVUaGVhdGVyU2VjcmV0S2V5MjAyNUZvckpXVFRva2VuR2VuZXJhdGlvbg==}
      
      # Email configuration
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your-app-password}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@movietheater.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Movie Theater System}
      EMAIL_VERIFICATION_BASE_URL: ${EMAIL_VERIFICATION_BASE_URL:-http://localhost:8080/cinema}
      
      # Google OAuth (sẽ được set từ environment variables)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      
      # Application settings
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      
    ports:
      - "8080:8080"
    volumes:
      # File uploads storage
      - app-uploads:/app/uploads
      # Logs
      - app-logs:/app/logs
    networks:
      - movie-theater-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/cinema/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # 📊 Adminer - Database Management Tool (Optional)
  adminer:
    image: adminer:4.8.1
    container_name: movie-theater-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:8080"
    networks:
      - movie-theater-network
    environment:
      ADMINER_DEFAULT_SERVER: mysql

# 🌐 Networks
networks:
  movie-theater-network:
    driver: bridge
    name: movie-theater-network

# 💾 Volumes
volumes:
  mysql-data:
    name: movie-theater-mysql-data
  app-uploads:
    name: movie-theater-app-uploads
  app-logs:
    name: movie-theater-app-logs 