server:
  port: 8080
  servlet:
    context-path: /cinema
#  ssl:
#    key-store: classpath:movietheater.p12
#    key-store-password: 12345678
#    key-store-type: PKCS12
#    key-alias: movietheater
#    enabled: true

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/cinema_db"
    username: cinema_user
    password: cinema_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Jackson Configuration
  jackson:
    default-property-inclusion: NON_NULL
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
      ACCEPT_EMPTY_STRING_AS_NULL_OBJECT: true
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
      WRITE_EMPTY_JSON_ARRAYS: true
    mapper:
      ACCEPT_CASE_INSENSITIVE_PROPERTIES: true
  
  # Spring Data Web Configuration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
      sort:
        sort-parameter: sort

  # File upload configuration (Spring Boot 3.x native multipart - no commons-fileupload needed)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Web configuration
  web:
    resources:
      add-mappings: true
  mvc:
    throw-exception-if-no-handler-found: false
    static-path-pattern: /static/**

  # Email configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:lumierecinema25@gmail.com}
    password: ${MAIL_PASSWORD:juvcrzwuvuwknpqj}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

  # Thymeleaf configuration for email templates
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # Security configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:bW92aWVUaGVhdGVyU2VjcmV0S2V5MjAyNUZvckpXVFRva2VuR2VuZXJhdGlvbg==}
  expiration: 900000 # 15 minutes in milliseconds

# Email Configuration
email:
  from: ${EMAIL_FROM:lumierecinema25@gmail.com}
  from-name: ${EMAIL_FROM_NAME:Lumiere Cinema}
  verification:
    expiration-hours: 24
    base-url: ${EMAIL_VERIFICATION_BASE_URL:http://localhost:8080}
  templates:
    verification: email/verification
    welcome: email/welcome
    password-reset: email/password-reset

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
  show-actuator: false
  group-configs:
    - group: customer-public
      display-name: "🔵 Customer APIs (Public)"
      paths-to-match:
        - /api/auth/login
        - /api/auth/register
        - /api/movies/public/**
        - /api/schedules/public/**
        - /api/cinema-rooms/public/**
        - /api/promotions/public/**
    - group: member-apis
      display-name: "🟢 Member APIs"
      paths-to-match:
        - /api/bookings/**
        - /api/members/**
        - /api/user/profile/**
    - group: employee-apis
      display-name: "🟡 Employee APIs"
      paths-to-match:
        - /api/staff/**
        - /api/employees/**
        - /api/checkin/**
    - group: admin-apis
      display-name: "🔴 Admin APIs"
      paths-to-match:
        - /api/admin/**
        - /api/movies/admin/**
        - /api/schedules/admin/**
        - /api/cinema-rooms/admin/**
        - /api/promotions/admin/**
        - /api/reports/**
        - /api/analytics/**

# Actuator Configuration for Docker health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
    mail:
      enabled: false
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# Logging Configuration
logging:
  level:
    com.swp.MovieTheaterService: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.mail: DEBUG

# Application specific configuration
app:
  name: Movie Theater Management System
  version: 1.0.0
  description: A comprehensive movie theater management system
  
  # Email configuration for EmailService
  email:
    company-name: Lumiere Cinema
    support-email: lumierecinema25@gmail.com
    website-url: http://localhost:8080
  
  # File storage configuration
  file:
    upload-dir: uploads/
    max-size: 10MB
    allowed-types: jpg,jpeg,png,gif,pdf
    
  # Business rules
  booking:
    max-seats-per-booking: 8
    booking-deadline-hours: 2 # Hours before showtime
    
  # Pagination defaults
  pagination:
    default-page-size: 20
    max-page-size: 100 