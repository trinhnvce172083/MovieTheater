# Profile để development với Docker MySQL trên cổng 3307
spring:
  datasource:
    url: "jdbc:mysql://localhost:3307/cinema_db"
    username: root
    password: 12345Aa
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# Logging cho development
logging:
  level:
    com.swp.MovieTheaterService: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG 