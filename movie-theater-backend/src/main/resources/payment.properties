# ==================== General Payment Settings ====================
# Payment limits (VND)
payment.min.amount=1000
payment.max.amount=50000000

# Payment timeout (minutes)
payment.timeout=15

# Refund settings
refund.auto.enabled=true
refund.fee.percentage=0.0
refund.processing.days=3

# Supported payment methods (ONLY VNPAY ENABLED)
payment.methods.vnpay.enabled=true
payment.methods.momo.enabled=false
payment.methods.zalopay.enabled=false
payment.methods.bank.transfer.enabled=false

# Payment fees (percentage)
payment.fee.vnpay=0.0

# Security settings
payment.signature.algorithm=HmacSHA512
payment.ip.validation.enabled=true
payment.callback.timeout=30

# Logging
payment.logging.enabled=true
payment.logging.level=INFO
payment.audit.enabled=true 