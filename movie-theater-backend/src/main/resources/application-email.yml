# Email Configuration
# Cấu hình email cho hệ thống rạp chiếu phim

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:lumierecinema25@gmail.com}
    password: ${EMAIL_PASSWORD:jstdgruqurruswtc}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            trust: smtp.gmail.com

  # Thymeleaf configuration for email templates
  thymeleaf:
    cache: false
    prefix: classpath:/templates/email/
    suffix: .html
    encoding: UTF-8
    mode: HTML

# Application email settings
app:
  email:
    company-name: ${COMPANY_NAME:Lumiere Cinema}
    support-email: ${SUPPORT_EMAIL:lumierecinema25@gmail.com}
    website-url: ${WEBSITE_URL:https://lumierecinema.vn}
    from-name: ${EMAIL_FROM_NAME:Lumiere Cinema Support}
    
    # Email retry configuration
    retry:
      max-attempts: 3
      delay-seconds: 5
      
    # Email queue configuration
    queue:
      enabled: true
      batch-size: 10
      processing-interval: 30
      
    # Email templates configuration
    templates:
      base-path: classpath:/templates/email/
      default-language: vi
      
    # Email tracking
    tracking:
      enabled: true
      pixel-enabled: true
      link-tracking: true
      
    # Email security
    security:
      rate-limit:
        enabled: true
        max-per-hour: 100
        max-per-day: 1000
      spam-protection:
        enabled: true
        check-content: true
        
# Logging configuration for email
logging:
  level:
    com.swp.MovieTheaterService.service.impl.EmailServiceImpl: INFO
    org.springframework.mail: DEBUG
    root: INFO 