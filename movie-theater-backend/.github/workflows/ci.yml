name: Movie Theater CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Dmaven.repo.local=${{ github.workspace }}/.m2/repository'

jobs:
  # 🔍 Validate and Build
  build:
    runs-on: ubuntu-latest
    name: Build and Validate
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 📦 Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: 🔍 Validate project
      run: mvn validate
      
    - name: 🏗️ Compile project
      run: mvn clean compile
      
    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: compiled-classes
        path: target/classes/

  # 🧪 Unit Tests
  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    name: Unit Tests
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 📦 Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: 🧪 Run unit tests
      run: mvn test
      
    - name: 📊 Publish test results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Unit Test Results
        path: target/surefire-reports/*.xml
        reporter: java-junit

  # 🗄️ Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    name: Integration Tests
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: cinema_test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 📦 Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: 🗄️ Run integration tests
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/cinema_test_db
        SPRING_DATASOURCE_USERNAME: test_user
        SPRING_DATASOURCE_PASSWORD: test_password
        SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        SPRING_PROFILES_ACTIVE: test
      run: mvn verify -Dspring.profiles.active=test

  # 🔐 Authentication API Tests
  auth-tests:
    runs-on: ubuntu-latest
    needs: build
    name: Authentication Tests
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: cinema_test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 📦 Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: 🔐 Setup authentication tests
      run: |
        sudo apt-get update
        sudo apt-get install -y curl jq
        
    - name: 🚀 Start application for testing
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/cinema_test_db
        SPRING_DATASOURCE_USERNAME: test_user
        SPRING_DATASOURCE_PASSWORD: test_password
        SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        SPRING_PROFILES_ACTIVE: test
      run: |
        mvn spring-boot:run -Dspring.profiles.active=test &
        APP_PID=$!
        echo $APP_PID > app.pid
        sleep 60
        
    - name: 🧪 Run authentication tests
      run: |
        chmod +x test-auth-ci.sh
        ./test-auth-ci.sh
        
    - name: 🛑 Stop application
      if: always()
      run: |
        if [ -f app.pid ]; then
          kill $(cat app.pid) || true
        fi
        
    - name: 📤 Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: auth-test-results
        path: auth-test-results.log

  # 📦 Package and Build Docker
  package:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, auth-tests]
    name: Package Application
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: 📦 Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: 📦 Package application
      run: mvn package -DskipTests
      
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 🔑 Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: 🐳 Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/movie-theater:latest
          ${{ secrets.DOCKER_USERNAME }}/movie-theater:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 🚀 Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: package
    name: Deploy to Staging
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: http://staging.movietheater.com
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🚀 Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "This would typically involve:"
        echo "- SSH to staging server"
        echo "- Pull latest Docker image"
        echo "- Update docker-compose.yml"
        echo "- Restart services"
        echo "✅ Staging deployment completed!"

  # 🚀 Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: package
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://movietheater.com
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🚀 Deploy to production
      run: |
        echo "🚀 Deploying to production environment..."
        echo "This would typically involve:"
        echo "- SSH to production server"
        echo "- Pull latest Docker image"
        echo "- Update docker-compose.yml"
        echo "- Restart services"
        echo "- Run health checks"
        echo "✅ Production deployment completed!" 